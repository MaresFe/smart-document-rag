name: Quality and security

on:
  pull_request:
  push:
    branches:
      - main
      - feature/user-authentication
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: smart_document_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d smart_document_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: smart_document_rag
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://rag_user:rag_password@localhost:5432/smart_document_rag
      TEST_DATABASE_URL: postgresql+psycopg://rag_user:rag_password@localhost:5432/smart_document_rag
      AUTH_SECRET_KEY: ci-only-secret-key-with-at-least-thirty-two-characters
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      TRUSTED_HOSTS: '["localhost", "127.0.0.1", "testserver"]'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-security.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            postgresql-client \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-tur

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-dev.txt \
            -r requirements-security.txt
          python -m pip check

      - name: Prepare database
        env:
          PGPASSWORD: rag_password
        run: |
          psql \
            --host localhost \
            --username rag_user \
            --dbname smart_document_rag \
            --command "CREATE EXTENSION IF NOT EXISTS vector;"
          alembic upgrade head
          alembic check

      - name: Compile backend
        run: python -m compileall -q app

      - name: Run backend tests
        run: |
          python -m pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run Python security analysis
        run: bandit -r app -ll -ii -s B105

  frontend:
    name: Frontend tests, lint, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test:coverage

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  secrets:
    name: Tracked secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan tracked files
        run: python scripts/scan_tracked_secrets.py

      - name: Validate self-hosted Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
